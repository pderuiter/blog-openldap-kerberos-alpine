---
- name: Update the Debian CA store
  ansible.builtin.command: update-ca-certificates
  changed_when: true

- name: Update the RHEL CA store
  ansible.builtin.command: update-ca-trust
  changed_when: true

- name: Restart nslcd
  ansible.builtin.service:
    name: nslcd
    state: restarted

- name: Restart nscd
  ansible.builtin.service:
    name: nscd
    state: restarted

- name: Restart sssd
  ansible.builtin.service:
    name: sssd
    state: restarted

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    state: restarted
